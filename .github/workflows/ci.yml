name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pull-request:
    name: Pull request follows decision 0009
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Branch name, title and linked issue
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          ok=true
          types='feat|fix|docs|refactor|test|ci|chore'
          if ! printf '%s' "$BRANCH" | grep -Eq "^(($types)/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*|release/[0-9]+\.[0-9]+)$"; then
            echo "Branch '$BRANCH' should be <type>/<issue>-<short-description>, such as feat/12-gyro-calibration."
            ok=false
          fi
          if ! printf '%s' "$TITLE" | grep -Eq "^($types)(\([a-z0-9-]+\))?!?: .+"; then
            echo "Title should follow Conventional Commits, such as 'feat(gyro): calibrate at power-on'."
            ok=false
          fi
          if ! printf '%s' "$BODY" | grep -Eiq "(closes|fixes|resolves) #[0-9]+"; then
            echo "The description should link its issue with 'Closes #<number>'."
            ok=false
          fi
          $ok

  firmware:
    name: Firmware build and cppcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the unit version check compares with the base branch
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.6.0
      - name: Units (names unique, and a new version for every changed unit)
        run: python3 scripts/dev.py units ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.base_ref) || '' }}
      - name: Install the pinned Arduino cores and libraries
        run: python3 scripts/dev.py setup
      - name: Build (T8 size limits, no warnings in our code)
        shell: bash
        run: |
          mkdir -p build
          python3 scripts/dev.py build --json | tee build/build-report.json
      - name: Keep the firmware image
        uses: actions/upload-artifact@v4
        with:
          name: firmware-uno-${{ github.sha }}
          path: |
            build/uno/uno.ino.hex
            build/uno/uno.ino.elf
            build/build-report.json
          if-no-files-found: error
      - name: Build the Wi-Fi dongle
        shell: bash
        run: python3 scripts/dev.py build --target dongle --json | tee build/build-report-dongle.json
      - name: Keep the dongle image
        uses: actions/upload-artifact@v4
        with:
          name: firmware-dongle-${{ github.sha }}
          path: |
            build/dongle/dongle.ino.bin
            build/dongle/dongle.ino.elf
            build/build-report-dongle.json
          if-no-files-found: error
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install --yes cppcheck
      - name: cppcheck
        run: python3 scripts/dev.py lint

  tests:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Firmware logic tests
        run: python scripts/dev.py test
      - name: Install the host package
        run: python -m pip install -e host
      - name: Host package tests
        run: python -m unittest discover -s host/tests
