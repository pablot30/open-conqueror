# The UNO build: board, pinned core version, and every unit the firmware is
# made of. scripts/dev.py builds with this profile and checks that every unit
# folder is listed here. Plain arduino-cli can use it too:
#   arduino-cli compile --profile uno firmware/uno
profiles:
  uno:
    fqbn: arduino:avr:uno
    platforms:
      - platform: arduino:avr (1.8.8)
    libraries:
      - Servo (1.3.0)
      - dir: hal/board
      - dir: devices/button
      - dir: devices/gyro
      - dir: devices/led
      - dir: devices/servos
      - dir: services/battery
      - dir: services/diagnostics
      - dir: services/link
      - dir: services/safety
      - dir: services/scheduler

default_profile: uno
