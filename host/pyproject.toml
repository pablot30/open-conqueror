# The host computer side of open-conqueror: the `conq` command.
# Install into the project's virtual environment from the repo root:
#   python -m venv .venv
#   .venv/bin/pip install -e host          (macOS, Linux)
#   .venv\Scripts\pip install -e host      (Windows)
[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-conqueror-host"
# Matches the VERSION file at the repo root, in Python's spelling
# (0.1.0-dev becomes 0.1.0.dev0). A unit test checks they agree.
version = "0.1.0.dev0"
description = "Host computer tools for the open-conqueror robot tank"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pyserial==3.5"]

[project.scripts]
conq = "conq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
